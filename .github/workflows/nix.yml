name: Nix

on:
  push:
  pull_request:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
      - name: Evaluate macOS and Ubuntu configurations
        run: nix flake check --all-systems --no-build
      - name: Build lightweight migration utilities
        run: nix build .#packages.x86_64-linux.doctor .#packages.x86_64-linux.cleanup-legacy .#checks.x86_64-linux.yuwd-cli
      - name: Check Nix formatting
        run: nix fmt -- --ci
